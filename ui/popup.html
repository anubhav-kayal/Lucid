<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucid</title>
  <style>
    :root { color-scheme: light; --ink:#17211d; --muted:#6e776f; --paper:#f4f1e8; --panel:#fffdf7; --line:#dfe2d7; --mint:#a8d8b5; --mint-dark:#2f6947; --amber:#b66a19; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { width:352px; padding:18px; background:var(--paper); color:var(--ink); font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
    .shell { border:1px solid var(--line); background:var(--panel); box-shadow:0 14px 36px rgb(35 49 40 / 10%); }
    .header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 18px 14px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:10px; }
    .brand-mark { display:grid; place-items:center; width:30px; height:30px; border-radius:9px; background:var(--ink); color:var(--mint); font:700 15px Georgia,serif; }
    .eyebrow { color:var(--muted); font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.13em; text-transform:uppercase; }
    .header h1 { margin-top:3px; font:700 19px Georgia,'Times New Roman',serif; letter-spacing:-.02em; }
    .badge { display:inline-flex; align-items:center; gap:6px; flex-shrink:0; border-radius:999px; padding:6px 9px; font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .badge::before { content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }
    .badge.local { background:#e5f2e6; color:var(--mint-dark); }
    .badge.cloud { background:#fff0dc; color:var(--amber); }
    .content { padding:18px; }
    .context { margin-bottom:14px; color:var(--muted); font-size:12px; line-height:1.45; }
    .status-card { display:flex; gap:11px; padding:13px; margin-bottom:14px; border:1px solid var(--line); background:#faf9f2; }
    .status-rule { width:3px; border-radius:3px; background:var(--mint-dark); }
    .privacy-indicator { color:var(--muted); font-size:11px; line-height:1.45; }
    button { width:100%; padding:12px 14px; border:0; border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; background:var(--ink); color:#fffdf7; transition:transform .18s,box-shadow .18s,opacity .18s; }
    button:hover { transform:translateY(-1px); box-shadow:0 6px 14px rgb(23 33 29 / 18%); }
    button:disabled { opacity:.4; cursor:not-allowed; }
    .status { margin-top:10px; color:var(--muted); font-size:11px; line-height:1.4; }
    .footer { display:flex; align-items:center; justify-content:space-between; margin-top:14px; color:var(--muted); font-size:10px; }
    .link-button { width:auto; padding:0; background:none; color:var(--mint-dark); font-size:11px; box-shadow:none; }
    .link-button:hover { transform:none; box-shadow:none; text-decoration:underline; }
    @media (prefers-reduced-motion: reduce) { button { transition:none; } button:hover { transform:none; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="header">
      <div class="brand"><span class="brand-mark">L</span><div><div class="eyebrow">Lucid / read better</div><h1>Make space for the page.</h1></div></div>
      <span class="badge local" id="mode-badge">On-device</span>
    </header>
    <div class="content">
      <p class="context" id="status-message">Ready to turn this page into a calmer reading space.</p>
      <div class="status-card"><span class="status-rule"></span><p class="privacy-indicator" id="privacy-note">Processing stays on your device.</p></div>
      <button id="toggle-reader">Open Reader View <span aria-hidden="true">↗</span></button>
      <footer class="footer"><span>Local by default</span><button class="link-button" id="open-options" type="button">Settings</button></footer>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
